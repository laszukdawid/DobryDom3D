name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sweethome3d
          key: junit-4.13.2-hamcrest-1.3

      - name: Set up Java 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # Exact Adoptium release jdk-26.0.2+10; keep in sync with Taskfile.yml
          # JAVA_VERSION / .tool-versions to avoid drift
          java-version: "26.0.2+10"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant ant-optional

      - name: Run fast smoke tests
        timeout-minutes: 5
        run: ant -noinput test-fast

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sweethome3d
          key: junit-4.13.2-hamcrest-1.3

      - name: Set up Java 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # Exact Adoptium release jdk-26.0.2+10; keep in sync with Taskfile.yml
          # JAVA_VERSION / .tool-versions to avoid drift
          java-version: "26.0.2+10"

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant ant-optional xvfb

      - name: Test and build
        timeout-minutes: 35
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" ant -noinput ci-full

      - name: Build Java 26 Linux archive
        run: ant -noinput linux64Installer

      - name: Coverage report (headless suite)
        run: ant -noinput coverage

      - name: SpotBugs analysis
        run: ant -noinput spotbugs

      - name: Verify test reports contain no environment properties
        id: report-safety
        if: always()
        run: |
          if [ -d build/test-reports ]; then
            set +e
            leaked_reports="$(grep -rl --include='TEST-*.xml' 'property name="env\.' build/test-reports)"
            scan_status=$?
            set -e
            if [ "$scan_status" -gt 1 ]; then
              echo "::error::Unable to scan JUnit reports for environment properties"
              exit "$scan_status"
            elif [ "$scan_status" -eq 0 ]; then
              echo "::error::Refusing to publish JUnit reports containing process environment properties"
              printf '%s\n' "$leaked_reports"
              exit 1
            fi
          fi

      - name: Upload test reports
        if: always() && steps.report-safety.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-reports-java-26
          path: build/test-reports/
          if-no-files-found: warn

      - name: Upload application JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DobryDom3D-java-26
          path: build/DobryDom3D.jar
          if-no-files-found: error

      - name: Upload Linux archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DobryDom3D-linux-x64-java-26
          path: install/DobryDom3D-*-linux-x64.tgz
          if-no-files-found: error

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports-java-26
          path: |
            build/coverage/jacoco.xml
            build/coverage/html/
          if-no-files-found: warn

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spotbugs-report-java-26
          path: build/spotbugs/spotbugs.xml
          if-no-files-found: warn
