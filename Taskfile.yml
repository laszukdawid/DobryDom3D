# This file is part of DobryDom3D, a fork of Sweet Home 3D 7.5, modified by DobryDom3D contributors since August 2026.
version: "3"

vars:
  # mise/asdf spelling of Adoptium release jdk-26.0.2+10 (non-LTS releases
  # carry no GA/LTS suffix); keep in sync with .tool-versions and CI.
  JAVA_VERSION: temurin-26.0.2+10
  APP_JAR: install/DobryDom3D-0.1.0.jar
  JAVA_HOME:
    sh: asdf where java "{{.JAVA_VERSION}}"

env:
  JAVA_HOME: "{{.JAVA_HOME}}"
  PATH: "{{.JAVA_HOME}}/bin:{{.PATH}}"

tasks:
  check-java:
    internal: true
    preconditions:
      - sh: command -v asdf >/dev/null 2>&1
        msg: asdf is required to run this task
      - sh: 'test -x "$(asdf where java "{{.JAVA_VERSION}}" 2>/dev/null)/bin/java"'
        msg: Install Java {{.JAVA_VERSION}} with asdf install java {{.JAVA_VERSION}}

  build:executable:
    internal: true
    deps: [check-java]
    sources:
      - Taskfile.yml
      - build.xml
      - src/**/*
      - lib/**/*
      - libtest/AppleJavaExtensions.jar
      - libtest/jnlp.jar
      - ./*.TXT
      - ./*.HTML
    generates:
      - "{{.APP_JAR}}"
    method: timestamp
    cmds:
      - ant clean jarExecutable

  run:
    desc: Build and run DobryDom3D
    deps: [build:executable]
    cmds:
      - '"{{.JAVA_HOME}}/bin/java" -jar "{{.APP_JAR}}"'

  package:image:
    desc: Build a self-contained Java 26 app image for this platform
    deps: [check-java]
    cmds:
      - ant clean packageAppImage

  package:linux:
    desc: Build the self-contained Linux x64 release archive
    deps: [check-java]
    preconditions:
      - sh: 'test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64'
        msg: package:linux requires Linux x64
    cmds:
      - ant clean linux64Installer

  test:
    desc: Run all tests in a virtual X server
    deps: [check-java]
    cmds:
      - task: test:virtual-x-server

  test:fast:
    desc: Run a small deterministic smoke suite for fast local iteration
    deps: [check-java]
    cmds:
      - ant test-fast

  test:headless:
    desc: Run the headless test suite
    deps: [check-java]
    cmds:
      - ant clean test

  test:virtual-x-server:
    desc: Run all tests in an isolated virtual X server
    deps: [check-java]
    preconditions:
      - sh: command -v xvfb-run >/dev/null 2>&1
        msg: "xvfb-run is required; install it with: sudo apt install xvfb"
    cmds:
      - xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" ant clean test-all
