version: "3"

vars:
  JAVA_VERSION: temurin-25.0.4+7.0.LTS
  JAVA_HOME:
    sh: asdf where java "{{.JAVA_VERSION}}"

env:
  JAVA_HOME: "{{.JAVA_HOME}}"
  JUNIT_JAR: '{{.JUNIT_JAR | default "/usr/share/java/junit4.jar"}}'
  PATH: "{{.JAVA_HOME}}/bin:{{.PATH}}"

tasks:
  check-java:
    internal: true
    preconditions:
      - sh: command -v asdf >/dev/null 2>&1
        msg: asdf is required to run this task
      - sh: 'test -x "$(asdf where java "{{.JAVA_VERSION}}" 2>/dev/null)/bin/java"'
        msg: Install Java {{.JAVA_VERSION}} with asdf install java {{.JAVA_VERSION}}

  run:
    desc: Build and run Sweet Home 3D
    deps: [check-java]
    cmds:
      - ant clean jarExecutable
      - java -jar install/SweetHome3D-7.5.jar

  test:
    desc: Run all tests in a virtual X server
    deps: [check-java]
    cmds:
      - task: test:virtual-x-server

  test:headless:
    desc: Run the headless test suite
    deps: [check-java]
    cmds:
      - ant clean test

  test:virtual-x-server:
    desc: Run all tests in an isolated virtual X server
    deps: [check-java]
    preconditions:
      - sh: command -v xvfb-run >/dev/null 2>&1
        msg: "xvfb-run is required; install it with: sudo apt install xvfb"
    cmds:
      - xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" ant clean test-all
